# Test suite for pr-verify itself: install the package, run the tests, on
# every supported Python. Stdlib only, so there is nothing else to install;
# the tests build throwaway git repositories (git is on every runner) and
# never touch the network.
name: ci

on:
  push:
  pull_request:

# The tests only read the repository: the token gets no more than that.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # requires-python is >=3.10: check that floor once, on the
          # cheapest runner, instead of on all three systems. (The oldest
          # Python is where argparse still lets a closed pipe through.)
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Test
        run: python -m unittest discover -s tests
      - name: Smoke-test the console script
        run: pr-verify --version
