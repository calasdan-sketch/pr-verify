# Test suite for pr-verify itself: install the package, run the tests, on
# every supported Python. Stdlib only, so there is nothing else to install;
# the tests build throwaway git repositories (git is on every runner) and
# never touch the network.
name: ci

on:
  push:
  pull_request:

# The tests only read the repository: the token gets no more than that.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # requires-python is >=3.10: check that floor once, on the
          # cheapest runner, instead of on all three systems. (The oldest
          # Python is where argparse still lets a closed pipe through.)
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      # On one job, a real GFM renderer for the Markdown report's tests
      # (tests/test_synapse1.py): with PR_VERIFY_REQUIRE_GFM=1 they must run
      # there, a missing renderer fails instead of skipping. A test tool
      # only; the package itself installs nothing.
      - name: Install the GFM renderer the Markdown tests use
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: pip install "cmarkgfm==2025.10.22"
      - name: Test
        env:
          PR_VERIFY_REQUIRE_GFM: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && '1' || '' }}
        run: python -m unittest discover -s tests
      - name: Benchmarks (the tests hold their thresholds; this prints the tables)
        run: |
          python benchmarks/riskclass_bench.py
          python benchmarks/attribution_bench.py
      - name: Smoke-test the console script
        run: pr-verify --version
