name: pr-verify
description: Deterministic trust scoring for agent-authored PRs - provenance, blast radius, policy gates, risk score. Fails the job when the score reaches min-score or a policy gate fails.
inputs:
  base:
    description: Base ref to diff against (same as --base). Empty auto-detects origin/HEAD, main, master, origin/main or origin/master; in CI pass origin/main explicitly.
    required: false
    default: ""
  head:
    description: Head ref (same as --head). The default HEAD includes uncommitted changes.
    required: false
    default: HEAD
  format:
    description: Report format, human, json, sarif or comment (same as --format).
    required: false
    default: human
  fail-on:
    description: Score gate preset, high / any-risk / never (same as --fail-on).
    required: false
    default: high
  min-score:
    description: Score at which the check fails, 0-100 (same as --min-score). Empty uses risk_threshold from .pr-verify.yaml, default 70.
    required: false
    default: ""
  skip-gates:
    description: Set to true to skip the policy gates (same as --skip-gates).
    required: false
    default: "false"
  root:
    description: Path inside the repository (same as --root); the repository's top level is verified. Empty means the working directory.
    required: false
    default: ""
  sarif-file:
    description: Also write the SARIF 2.1.0 log to this path (same as --sarif-file); upload it with github/codeql-action/upload-sarif (that step needs security-events write). Empty means no file.
    required: false
    default: ""
  comment:
    description: Set to true to post the result as ONE sticky pull request comment, updated on every push (headline Review depth skim, normal or deep). Needs the permission pull-requests write for the token; a token that cannot post (pull requests from forks) gives a warning, never a failed check.
    required: false
    default: "false"
  github-token:
    description: The token the comment is posted with. The default is the workflow's own token; it must have pull-requests write.
    required: false
    default: ${{ github.token }}
  step-summary:
    description: Set to false to leave the job summary alone; by default the same markdown as the comment is added to it.
    required: false
    default: "true"
outputs:
  score:
    description: Risk score 0-100.
    value: ${{ steps.verify.outputs.score }}
  band:
    description: Risk band, low / medium / high.
    value: ${{ steps.verify.outputs.band }}
  requires-review:
    description: true when the score reached min-score.
    value: ${{ steps.verify.outputs.requires-review }}
  exit-code:
    description: Exit status of pr-verify check (0 pass, 1 fail, 2 error); set on every path, also when the inputs are refused.
    value: ${{ steps.verify.outputs.exit-code }}
runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        PR_VERIFY_BASE: ${{ inputs.base }}
        PR_VERIFY_HEAD: ${{ inputs.head }}
        PR_VERIFY_FORMAT: ${{ inputs.format }}
        PR_VERIFY_FAIL_ON: ${{ inputs.fail-on }}
        PR_VERIFY_MIN_SCORE: ${{ inputs.min-score }}
        PR_VERIFY_SKIP_GATES: ${{ inputs.skip-gates }}
        PR_VERIFY_ROOT: ${{ inputs.root }}
        PR_VERIFY_SARIF_FILE: ${{ inputs.sarif-file }}
        PR_VERIFY_COMMENT: ${{ inputs.comment }}
        PR_VERIFY_GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_VERIFY_STEP_SUMMARY: ${{ inputs.step-summary }}
      # -I: the checkout (the working directory) is data, never imported from;
      # see run_action.py. Nothing to install: pr-verify has no dependencies.
      run: python -I "$GITHUB_ACTION_PATH/run_action.py"
