[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-verify"
version = "0.1.0"
description = "Deterministic trust scoring for agent-authored PRs."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
pr-verify = "pr_verify.cli:main"

[tool.setuptools]
packages = ["pr_verify"]

[tool.pytest.ini_options]
# tests import their shared fixture as a top-level module, like
# `python -m unittest discover -s tests` does.
pythonpath = ["tests"]
testpaths = ["tests"]
