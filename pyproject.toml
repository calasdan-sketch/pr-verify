[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-verify"
version = "0.1.5"
description = "Deterministic trust scoring for agent-authored PRs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Calas Automations Inc."}]
keywords = [
    "pull-request", "code-review", "ai-agents", "provenance",
    "blast-radius", "risk-score", "git", "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/pr-verify"
Repository = "https://github.com/calasdan-sketch/pr-verify"
Issues = "https://github.com/calasdan-sketch/pr-verify/issues"

[project.scripts]
pr-verify = "pr_verify.cli:main"

[tool.setuptools]
packages = ["pr_verify"]

[tool.pytest.ini_options]
# tests import their shared fixture as a top-level module, like
# `python -m unittest discover -s tests` does.
pythonpath = ["tests"]
testpaths = ["tests"]
